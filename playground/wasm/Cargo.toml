[package]
name = "wlel-playground"
version = "1.6.0"
edition = "2021"
publish = false
description = "Wlel front-end compiled to WebAssembly for the browser playground"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wlel = { path = "../.." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
