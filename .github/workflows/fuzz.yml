name: fuzz

# Roadmap (Fase 2 / Fase 4): parser+checker fuzzing, daily soak.
# Kriteria: fuzz berjalan tanpa crash/panic.

on:
  schedule:
    - cron: "23 3 * * *" # daily, 03:23 UTC
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz target (ASan, -O)
        run: cargo fuzz build -O
      - name: Fuzz lexer/parser/checker (30 min)
        # corpus lives outside the checkout so new units never dirty the repo
        run: |
          mkdir -p /tmp/fuzz-corpus
          cp fuzz/corpus/parse/* /tmp/fuzz-corpus/
          cargo fuzz run -O parse -- \
            -max_total_time=1800 -max_len=8192 -rss_limit_mb=2560 \
            -print_final_stats=1 /tmp/fuzz-corpus
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
