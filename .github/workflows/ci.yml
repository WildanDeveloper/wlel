name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # build + full test suite on the three release OSes; the suite itself
  # runs the Wlel-generated code under ASan+UBSan (safe_tests and the
  # `wlel build -sanitize` dogfood tests) on Linux/macOS, UBSan on Windows
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW-w64 GCC (C backend)
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test suite
        run: cargo test --release --locked

  # the three flagship apps are the end-to-end proof that the language
  # carries real programs. They were previously not exercised by CI at all,
  # which let flagship/json.wlel stop type-checking while every job stayed
  # green. `game.wlel` only needs raylib to *build* — its tests run windowless,
  # so check/test need no graphics library.
  flagship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compiler
        run: cargo build --release --locked
      - name: Type-check every flagship
        run: |
          for f in flagship/*.wlel; do
            ./target/release/wlel check "$f"
          done
      - name: Run every flagship's test blocks
        run: |
          for f in flagship/*.wlel; do
            ./target/release/wlel test "$f"
          done
      - name: Build the dependency-free flagships
        run: |
          ./target/release/wlel build flagship/json.wlel -O2 -o "$RUNNER_TEMP/json"
          ./target/release/wlel build flagship/httpd.wlel -O2 -o "$RUNNER_TEMP/httpd"
      # an explicit, deliberately low floor: shared CI runners are slower and
      # noisier than the reference machine, so this only catches the class of
      # regression that matters (the old O(n^2) parse ran at ~1.3 MB/s). Run
      # locally with `wlel run flagship/json.wlel -- bench` for the headline
      # number (the app's own default floor is 20 MB/s).
      - name: JSON parser throughput smoke
        run: |
          "$RUNNER_TEMP/json" bench 8 10

  # The editor artifacts are JSON, JavaScript and a generated C parser, so
  # nothing in a normal `cargo test` would notice them rotting. This job
  # installs the two tools the editor tests look for and runs them for real:
  # the TextMate grammar, the extension bridge, the generated tree-sitter
  # parser and its queries.
  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli
      - name: Editor artefacts (VS Code + tree-sitter)
        run: cargo test --locked --test editor_tests -- --nocapture

  # keep the quality bar the repo already claims: clippy -D warnings and
  # canonical .wlel formatting (wlel fmt -check, the fmt∘fmt == fmt guarantee)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: wlel fmt -check (examples + flagships)
        run: |
          cargo build --release --locked
          find examples flagship -name '*.wlel' -print0 | xargs -0 ./target/release/wlel fmt -check
      # the tag-driven release workflow only runs on v* tags; exercise the
      # packaging script on every push so a broken artifact is caught here
      - name: Release packaging dry run
        run: |
          ./scripts/release.sh
          tar -tzf dist/wlel-*-x86_64-unknown-linux-gnu.tar.gz | grep -qx '.*/wlel'
