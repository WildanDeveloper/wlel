version: 2
updates:
  # the compiler itself has no third-party dependencies; this keeps the
  # fuzz harness (libfuzzer-sys) and the pinned GitHub Actions current
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
